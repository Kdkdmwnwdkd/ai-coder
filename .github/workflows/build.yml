name: 构建 AI编程助手 APK

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-debug:
    name: 编译 Debug APK (arm64-v8a)
    runs-on: ubuntu-24.04
    env:
      JAVA_VERSION: "17"
      JAVA_DIST: "temurin"
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false, fetch-depth: 1 }

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          cache: "gradle"

      # =====================================================
      # M5 JNI 前置：确保 Android SDK 已装 NDK + CMake 3.22.1
      #  —— AGP 8.x externalNativeBuild 配置期需要这两个组件，
      #     ubuntu-24.04 Runner 默认不装。sdkmanager --install 一步搞定
      # =====================================================
      - name: 安装 Android NDK + CMake 3.22.1（M5 JNI 必需）
        run: |
          set -euo pipefail
          [ -z "$ANDROID_HOME" ] && export ANDROID_HOME="$HOME/Android/Sdk"
          [ -z "$ANDROID_SDK_ROOT" ] && export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "⚠️ sdkmanager 不存在，尝试用 which sdkmanager"
            SDKMANAGER=$(which sdkmanager || true)
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          echo "yes | $SDKMANAGER --install 'ndk;26.1.10909125' 'cmake;3.22.1' 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" --install \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            2>&1 | tail -n 20 || true
          # 确认安装后路径存在
          ls -lh "$ANDROID_HOME/ndk/" 2>/dev/null || true
          ls -lh "$ANDROID_HOME/cmake/" 2>/dev/null || true

      # =====================================================
      # 🛡️ 解决"每次出新包都要卸载旧版才能装"的根因：签名固定
      # —— 之前每轮 Actions 的 debug keystore 都是 Runner 临时生成的，SHA1 不同 → 覆盖失败。
      # 现在从 GitHub Secrets 读固定的 keystore（base64 编码的 xuedi-debug.jks），decode 成文件，
      # 然后把路径/密码/alias 写进 GITHUB_ENV，app/build.gradle.kts 的 signingConfigs.fixedDebug
      # 会从环境变量读取并使用。后续 debug 和 临时 release 都用同一个 keystore 签，
      # 同包名 + 同签名 → 100% 可覆盖安装，再也不用卸载！
      # =====================================================
      - name: 准备固定签名 Debug keystore（解决覆盖安装问题）
        if: ${{ always() }}
        env:
          XUEDI_DEBUG_KS_B64: ${{ secrets.XUEDI_DEBUG_KS_B64 }}
          XUEDI_DEBUG_STORE_PASSWORD: ${{ secrets.XUEDI_DEBUG_STORE_PASSWORD }}
          XUEDI_DEBUG_KEY_ALIAS: ${{ secrets.XUEDI_DEBUG_KEY_ALIAS }}
          XUEDI_DEBUG_KEY_PASSWORD: ${{ secrets.XUEDI_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [ -n "${XUEDI_DEBUG_KS_B64}" ]; then
            # 🔴 关键：printf '%s' 而不是 echo —— echo 默认加换行 \n，
            #    导致 base64 decode 后 keystore 尾部多 1 字节，SHA1 对不上，签名直接废。
            printf '%s' "$XUEDI_DEBUG_KS_B64" | base64 --decode > keystore/xuedi-debug.jks
            echo "✅ 已从 Secrets 解码 debug keystore：keystore/xuedi-debug.jks ($(wc -c < keystore/xuedi-debug.jks) B)"
          else
            echo "⚠️ XUEDI_DEBUG_KS_B64 secret 未设置，将回退到 Gradle Runner 临时生成的 keystore（可能导致覆盖安装失败）"
          fi
          echo "XUEDI_DEBUG_STORE_FILE=$PWD/keystore/xuedi-debug.jks" >> "$GITHUB_ENV"
          echo "XUEDI_DEBUG_STORE_PASSWORD=$XUEDI_DEBUG_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "XUEDI_DEBUG_KEY_ALIAS=$XUEDI_DEBUG_KEY_ALIAS"                >> "$GITHUB_ENV"
          echo "XUEDI_DEBUG_KEY_PASSWORD=$XUEDI_DEBUG_KEY_PASSWORD"          >> "$GITHUB_ENV"
          ls -lh keystore/ || true

      - name: 环境预检（Gradle/Java/磁盘）
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          echo ""
          echo "--- 磁盘剩余 ---"
          df -h /mnt || df -h /
          echo ""
          chmod +x gradlew
          ./gradlew --version 2>&1 | tail -n 8

      - name: 编译 Debug APK（完整日志，不截断）
        run: |
          set -euo pipefail
          LOG_FILE="build-debug.log"
          ./gradlew --no-daemon --warning-mode all \
            :app:assembleDebug \
            --stacktrace 2>&1 | tee "$LOG_FILE"
          echo ""
          echo "=== 构建完成，产物列表 ==="
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null || true

      - name: 如果失败，单独打印错误摘要（方便排查）
        if: failure()
        run: |
          echo "=== 🔴 关键错误摘要（FAILURE / Caused by / Could not / e: ）==="
          grep -nE 'FAILURE|BUILD FAILED| Caused by:|Could not find|Could not resolve|e: [A-Z]|error:|Unresolved reference| not found' build-debug.log 2>/dev/null | head -n 80 || true

      - name: 收集 Debug APK
        id: apk
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "❌ 找不到 Debug APK，当前目录结构："
            find app/build/outputs -type f 2>/dev/null | head -n 40 || true
            exit 1
          fi
          SHA="$(git rev-parse --short HEAD)"
          OUT="AI编程助手-debug-${SHA}-arm64-v8a.apk"
          cp "$APK" "$OUT"
          echo "apk_file=$OUT" >> "$GITHUB_OUTPUT"
          echo "→ $APK  →  $OUT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AI编程助手-debug-apk
          path: ${{ steps.apk.outputs.apk_file }}
          retention-days: 90
          if-no-files-found: error

      - name: 上传完整 Gradle 日志（方便后续排查）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-debug-log
          path: build-debug.log
          retention-days: 30
          if-no-files-found: ignore

  # =====================================================
  # M7 Release 打包：tag v* 时跑，出 release APK。
  # 签名策略：app/build.gradle.kts 的 signingConfigs.release 优先读
  #   SIGNING_STORE_FILE 等 Secrets；未配则 fallback 到 fixedDebug
  #   （复用 debug keystore，能出包能覆盖安装；正式 release keystore 待
  #   用户提供 shimmer_xuedi_release.jks 后替换 Secrets 即可切正式签名）。
  # =====================================================
  build-release:
    name: 编译 Release APK (arm64-v8a)
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      JAVA_VERSION: "17"
      JAVA_DIST: "temurin"
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false, fetch-depth: 1 }

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          cache: "gradle"

      - name: 安装 Android NDK + CMake 3.22.1（M5 JNI 必需）
        run: |
          set -euo pipefail
          [ -z "$ANDROID_HOME" ] && export ANDROID_HOME="$HOME/Android/Sdk"
          [ -z "$ANDROID_SDK_ROOT" ] && export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager || true)
          fi
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" --install \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            2>&1 | tail -n 20 || true

      - name: 准备固定签名 keystore（release fallback 复用 debug keystore）
        env:
          XUEDI_DEBUG_KS_B64: ${{ secrets.XUEDI_DEBUG_KS_B64 }}
          XUEDI_DEBUG_STORE_PASSWORD: ${{ secrets.XUEDI_DEBUG_STORE_PASSWORD }}
          XUEDI_DEBUG_KEY_ALIAS: ${{ secrets.XUEDI_DEBUG_KEY_ALIAS }}
          XUEDI_DEBUG_KEY_PASSWORD: ${{ secrets.XUEDI_DEBUG_KEY_PASSWORD }}
          # 正式 release keystore（可选；未配则 fallback fixedDebug）
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [ -n "${XUEDI_DEBUG_KS_B64}" ]; then
            printf '%s' "$XUEDI_DEBUG_KS_B64" | base64 --decode > keystore/xuedi-debug.jks
            echo "✅ debug keystore 就位 ($(wc -c < keystore/xuedi-debug.jks) B)"
          fi
          echo "XUEDI_DEBUG_STORE_FILE=$PWD/keystore/xuedi-debug.jks" >> "$GITHUB_ENV"
          echo "XUEDI_DEBUG_STORE_PASSWORD=$XUEDI_DEBUG_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "XUEDI_DEBUG_KEY_ALIAS=$XUEDI_DEBUG_KEY_ALIAS"                >> "$GITHUB_ENV"
          echo "XUEDI_DEBUG_KEY_PASSWORD=$XUEDI_DEBUG_KEY_PASSWORD"          >> "$GITHUB_ENV"
          # 正式 release Secrets（如果有）透传给 build.gradle.kts 的 signingConfigs.release
          echo "SIGNING_STORE_FILE=$SIGNING_STORE_FILE"                     >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"             >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"                       >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"                 >> "$GITHUB_ENV"

      - name: 编译 Release APK
        run: |
          set -euo pipefail
          LOG_FILE="build-release.log"
          ./gradlew --no-daemon --warning-mode all \
            :app:assembleRelease \
            --stacktrace 2>&1 | tee "$LOG_FILE"
          echo "=== 产物列表 ==="
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null || true

      - name: 如果失败，打印错误摘要
        if: failure()
        run: |
          grep -nE 'FAILURE|BUILD FAILED| Caused by:|Could not find|Could not resolve|e: [A-Z]|error:|Unresolved reference| not found' build-release.log 2>/dev/null | head -n 80 || true

      - name: 收集 Release APK
        id: rapk
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "❌ 找不到 Release APK"
            find app/build/outputs -type f 2>/dev/null | head -n 40 || true
            exit 1
          fi
          SHA="$(git rev-parse --short HEAD)"
          OUT="AI编程助手-release-${SHA}-arm64-v8a.apk"
          cp "$APK" "$OUT"
          echo "rapk_file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AI编程助手-release-apk
          path: ${{ steps.rapk.outputs.rapk_file }}
          retention-days: 90
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-release-log
          path: build-release.log
          retention-days: 30
          if-no-files-found: ignore

  # =====================================================
  # M7 GitHub Release：tag v* 时，下载 release APK artifact 挂到 Release。
  # =====================================================
  publish-release:
    name: 发布 GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 Release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: AI编程助手-release-apk

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          generate_release_notes: true
          fail_on_unmatched_files: true

  # =====================================================
  # v1.3.0 直链：在 GitHub runner（干净网络）跑，按顺序试 3 个免费图床/网盘，
  #   任一成功即拿到 URL 挂回 Release asset。GitHub 是出包主力，沙箱只发命令。
  #   服务优先级：0x0.st（永久）> tmpfiles.org（30天）> litterbox（72h）
  # =====================================================
  upload-mirror:
    name: 生成国内直链（GitHub runner · 多服务 fallback）
    # 🔴 关键修复：必须 needs publish-release！否则本 job 跟发布 job 并行跑，
    #   gh release download 时 Release 还没建好 → "release not found" → 直链永远拿不到。
    needs: publish-release
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 🔴 修复：原来硬编码 v1.3.0，导致每次只给 v1.3.0 找镜像、新版永远没直链。
      #   改成动态取当前 tag（tag 推送时 = refs/tags/v1.3.11 → ref_name=v1.3.11）。
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 从 GitHub Release 下载 APK
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p apk
          gh release download "$TAG" --repo "$REPO" -D ./apk --clobber -p '*.apk' || gh release download "$TAG" --repo "$REPO" -D ./apk --clobber
          APK="$(ls ./apk/*.apk | head -1)"
          echo "APK=$APK ($(du -h "$APK" | cut -f1))"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: 多服务并发上传（tmpfiles / litterbox 任一成功即用）
        run: |
          set -uo pipefail
          URL=""
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'

          try_tmpfiles() {
            echo "→ 尝试 tmpfiles.org（30天）..." >&2
            R="$(curl -sS --max-time 240 -A "$UA" -F "file=@$APK_PATH" https://tmpfiles.org/api/v1/upload 2>&1 || true)"
            echo "tmpfiles 返回: $R" >&2
            U="$(echo "$R" | grep -oE 'https://tmpfiles\.org/[^"]+' | head -1)"
            [ -n "$U" ] && echo "${U/tmpfiles.org/tmpfiles.org/dl}"
          }
          try_litterbox() {
            echo "→ 尝试 litterbox（72h）..." >&2
            for i in 1 2 3; do
              R="$(curl -sSL --max-time 240 -A "$UA" -F 'time=72h' -F 'reqtype=fileupload' -F "fileToUpload=@$APK_PATH" https://litterbox.catbox.moe/resources/internals/api.php 2>&1 || true)"
              echo "litterbox 第 $i 次返回: $R" >&2
              case "$R" in https://*) echo "$R"; return 0;; esac
              sleep 10
            done
            echo "litterbox 3 次都失败" >&2
          }

          URL="$(try_tmpfiles || true)"
          [ -z "$URL" ] && URL="$(try_litterbox || true)"

          if [ -z "$URL" ]; then
            echo "❌ 2 个服务都失败"
            exit 1
          fi
          printf '%s\n' "$URL" > mirror-url.txt
          echo "✅ 拿到国内直链: $URL"

      - name: 把直链作为 Release asset 挂回
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: mirror-url.txt
