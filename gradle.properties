org.gradle.jvmargs=-XX:+UseParallelGC -Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.enabled=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 构建签名信息（真实值通过 -P 注入或仓库 Secrets，别提交明文）
RELEASE_STORE_FILE=signing/xuedi_coder_release.jks
RELEASE_STORE_PASSWORD=
RELEASE_KEY_ALIAS=
RELEASE_KEY_PASSWORD=

# 注意：
# 1) 请不要在仓库级 gradle.properties 里写代理。
#    本地需要代理（沙箱/内网）时用 -D 传，如：
#    gradle -DsystemProp.https.proxyHost=127.0.0.1 -DsystemProp.https.proxyPort=18080 :app:assembleDebug
# 2) Release 签名密码通过 -P 或 GitHub Secrets 注入，不要留空值/明文提交。
