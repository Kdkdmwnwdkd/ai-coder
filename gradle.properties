# cgroup mem=4G; 前两轮 Gradle daemon 都因为 native compile 叠加期 java RSS > 1.4G 被 cgroup OOM-kill
# 本轮直接关掉 daemon，并用 JVM 参数让 Gradle client 本身尽量瘦：低 Xmx + SerialGC + 压缩指针
# 同时为 C++ 侧留出充足空间（clang++ 每个翻译单元 250~500MB RSS；ld.lld 链接 libxuedi-llama.so ≈ 1.2G）
org.gradle.jvmargs=-Xmx820m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -XX:+UseCompressedOops -XX:+UseCompressedClassPointers -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
kotlin.incremental=false
kotlin.caching.enabled=false
