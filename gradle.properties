org.gradle.jvmargs=-XX:+UseParallelGC -Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.enabled=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 构建签名信息（真实值通过 -P 注入或仓库 Secrets，别提交明文）
RELEASE_STORE_FILE=signing/xuedi_coder_release.jks
RELEASE_STORE_PASSWORD=
RELEASE_KEY_ALIAS=
RELEASE_KEY_PASSWORD=

# ======== Gradle 插件仓库代理 ========
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.local|*.svc|*.cluster.local
